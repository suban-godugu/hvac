services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: hvac
      POSTGRES_PASSWORD: hvac
      POSTGRES_DB: hvac
    ports:
      - "5432:5432"
    volumes:
      - hvac_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    environment:
      HVAC_ENV: development
      HVAC_START_CONTROL_WORKER: "0"
      DATABASE_URL: postgresql://hvac:hvac@postgres:5432/hvac
      HVAC_ALLOW_CREATE_ALL: "1"
      HVAC_DEPLOYMENT_MODE: local
      HVAC_CORS_ORIGINS: http://localhost:3000
      HVAC_BMS_MODE: simulation
      HVAC_BMS_WRITE_ENABLED: "0"
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  control-worker:
    build: .
    command: python -m backend.workers.control_entrypoint
    environment:
      DATABASE_URL: postgresql://hvac:hvac@postgres:5432/hvac
      HVAC_BMS_MODE: simulation
      HVAC_BMS_WRITE_ENABLED: "0"
    depends_on:
      - postgres

  job-worker:
    build: .
    command: python -m backend.workers.job_worker
    environment:
      DATABASE_URL: postgresql://hvac:hvac@postgres:5432/hvac
    depends_on:
      - postgres

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"

volumes:
  hvac_pg:
